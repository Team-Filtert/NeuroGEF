name: Publish Game

on:
    workflow_dispatch:

permissions: {}

jobs:
    build:
        name: Build game
        outputs:
            artifact-id: ${{ steps.upload.outputs.artifact-id }}
        runs-on: ubuntu-latest
        env:
            VERSION: 4.6.3
            BINARY_SUM: a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c
            TEMPLATE_SUM: da606b61c10157844f8300172df374472665f95015495cb1a7cd132c40ede404faa96cc1016a4b9662db9909ddea69632c4948b2cd11163438dad4808881fb68
            SAVE_DIR: bin
        permissions:
          id-token: write
          contents: read
          attestations: write
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0
              with:
                persist-credentials: false
            
            - name: Cache Godot engine + export templates
              id: cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.0.0
              with:
                path: ${{ env.SAVE_DIR }}/
                key: godot-v${{ env.VERSION }}-linux64
            
            - name: Download Godot
              if: steps.cache.outputs.cache-hit == ''
              run: |
                curl -o ${{ env.SAVE_DIR }}/godot https://downloads.godotengine.org/?version=${{ env.VERSION }}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64

                if [ "$(sha512sum ${{ env.SAVE_DIR }}/godot)" = "${{ env.BINARY_SUM }}" ]; then
                  echo "Godot binary checksum passed!"
                else
                  echo "Checksum for Godot binary did not pass! Action failed!"
                  exit 1
                fi

                curl -o ${{ env.SAVE_DIR }}/export-templates.tpz https://downloads.godotengine.org/?version=${{ env.VERSION }}&flavor=stable&slug=export_templates.tpz&platform=templates

                if [ "$(sha512sum ${{ env.SAVE_DIR }}/export-templates.tpz)" = "${{ env.TEMPLATE_SUM }}" ]; then
                  echo "Godot export template checksum passed!"
                else
                  echo "Checksum for export templates did not pass! Action failed!"
                  exit 1
                fi
            
            - name: Make Godot executable & alias Godot
              run: |
                mkdir ./bin
                chmod +x ./bin/godot
                alias godot="./bin/godot --headless"
            
            - run: godot --export-release "Windows Desktop" ./project.godot
            - run: godot --export-release "macOS" ./project.godot
            - run: |
                godot --export-release "Linux" ./project.godot
                chmod +x ./build/neurojrpg
            
            - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # v4.0.0
              with:
                subject-path: ./build/neurojrpg.exe
              
            - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # v4.0.0
              with:
                subject-path: ./build/neurojrpg.app
              
            - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # v4.0.0
              with:
                subject-path: ./build/neurojrpg
            
            - run: cd build && zip ../dist/neuro-gef-win.zip ./neurojrpg.exe
            - run: cd build && zip -r ../dist/neuro-gef-mac.zip ./neurojrpg.app
            - run: cd build && tar -czvf ../dist/neuro-gef-linux.tar.gz ./neurojrpg
            
            - name: Upload artifacts
              id: upload
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
              with:
                path: dist/*
                name: neuro-sama_gef
    
    distribute:
        name: Upload to itch.io
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: itch.io
            url: https://teamfiltered.itch.io/neuro-sama-the-good-the
        steps:
            - name: Download artifacts
              id: download
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  #v8.0.0
              with:
                artifact-ids: ${{ needs.build.outputs.artifact-id }}
                path: ./dist
            
            - name: Setup itch.io credentials
              env:
                BUTLER_VERSION: 15.29.0
                BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
              run: |
                curl -o butler.zip https://broth.itch.zone/butler/linux-amd64/${{ env.BUTLER_VERSION }}/archive.zip
                echo "Butler ZIP SHA-256: $(sha256sum butler.zip)"
                unzip butler.zip
                butler login
            
            - name: Upload game binaries
              run: |
                butler push ${{ steps.download.outputs.download-path }}/neuro-gef-win.zip TeamFiltered/neuro-sama-the-good-the:windows-latest

            # - name: Post to Discord webhook
            #   run: |
            #     curl -X POST ${{ secrets.PUBLISH_WEBHOOK }}
